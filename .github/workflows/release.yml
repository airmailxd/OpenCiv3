name: Release
on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.4)
        required: true

env:
  GODOT_VERSION: 4.4.1
  EXPORT_NAME: OpenCiv3
  PROJECT_DIR: C7
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

# NOTE: releases do not run the test suite or the formatting check; those run
# in export-c7.yml on every push to Development. Whether a release should be
# gated on them is an open decision.
jobs:
  Build:
    runs-on: ubuntu-latest
    # Package downloads occasionally hang; fail fast instead of after 6 hours.
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:mono-4.4.1
    strategy:
      matrix:
        include:
        - platform: windows
          preset: Windows Desktop
        - platform: linux
          preset: Linux/X11
        - platform: mac
          preset: macOS
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ env.TAG }}
        lfs: true
        submodules: true
    - uses: ./.github/workflows/composite/buildSetup
    - name: Export
      run: |
        mkdir -v -p build/OpenCiv3
        cd ${PROJECT_DIR}
        dotnet build
        if [ "${{ matrix.platform }}" = "mac" ]; then
          godot -v --headless --export-release "${{ matrix.preset }}" ../build/mac.zip
        elif [ "${{ matrix.platform }}" = "linux" ]; then
          godot -v --headless --export-release "${{ matrix.preset }}" ../build/OpenCiv3/${EXPORT_NAME}.x86_64
        else
          godot -v --headless --export-release "${{ matrix.preset }}" ../build/OpenCiv3/${EXPORT_NAME}.exe
        fi
    - name: Package
      run: |
        case "${{ matrix.platform }}" in
          mac)
            cd ${PROJECT_DIR} && zip -q -r ../build/mac.zip Assets Text Lua ModernArt
            ;;
          linux)
            cp -r ${PROJECT_DIR}/Text ${PROJECT_DIR}/Assets ${PROJECT_DIR}/Lua ${PROJECT_DIR}/ModernArt build/OpenCiv3/
            tar -C build -zcf build/linux.tar.gz OpenCiv3
            ;;
          windows)
            cp -r ${PROJECT_DIR}/Text ${PROJECT_DIR}/Assets ${PROJECT_DIR}/Lua ${PROJECT_DIR}/ModernArt build/OpenCiv3/
            cd build && zip -q -r windows.zip OpenCiv3
            ;;
        esac
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform }}
        path: build/${{ matrix.platform == 'linux' && 'linux.tar.gz' || format('{0}.zip', matrix.platform) }}

  Publish-Release:
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: Create or update release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        ls -la dist
        if gh release view "$TAG" > /dev/null 2>&1; then
          gh release upload "$TAG" dist/* --clobber
        else
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes --latest
        fi

